plugins { id 'com.android.application' }
android {
    namespace 'com.valentinebsaa.gamingai'
    compileSdk 34
    defaultConfig {
        applicationId 'com.valentinebsaa.gamingai'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Stable signing credentials are injected ONLY through GitHub Actions secrets
    // or the owner's local environment. No private key may be committed to the repo.
    signingConfigs {
        companionRelease {
            def filePath = System.getenv("GAMING_AI_RELEASE_KEYSTORE_PATH")
            if (filePath) {
                storeFile file(filePath)
                storePassword System.getenv("GAMING_AI_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("GAMING_AI_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("GAMING_AI_RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("GAMING_AI_RELEASE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.companionRelease
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
