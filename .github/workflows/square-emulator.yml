name: RG Rotate 720 square emulator smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/square-emulator.yml'
      - 'scripts/square_emulator_smoke.sh'
      - 'app/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/square-emulator.yml'
      - 'scripts/square_emulator_smoke.sh'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  square-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android compile SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
      - name: Allow KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: "720x720 Android 12 emulator: screenshot and navigate"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:assembleDebug
            bash scripts/square_emulator_smoke.sh
      - name: Upload square screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotate-720-emulator-evidence
          path: square-evidence
          if-no-files-found: warn
