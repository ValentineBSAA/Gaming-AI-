name: Android debug APK + unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK 34 platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload sideloadable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-ai-rotate-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
