name: Android debug APK + unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android platform (runner has command-line SDK tools)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preflight release privacy and packaging policies
        run: python3 scripts/release_preflight.py
      - name: Validate grayscale PNG layers and alpha
        run: python3 scripts/check_orb_assets.py
      - name: Run unit tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload sideloadable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-ai-rotate-v0.2.0-rc-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Release signing must survive across APK versions. No key in GitHub source.
      # Without the four repository secrets we upload debug-only testing builds.
      - name: Recover private stable signing key when configured
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SIGNING_B64: ${{ secrets.GAMING_AI_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.GAMING_AI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAMING_AI_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GAMING_AI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_B64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Signing secrets are missing. Run scripts/setup-signing.ps1 privately on Windows first."
              exit 1
            fi
            echo "No stable signing key configured. Only the debug artifact is available."
            exit 0
          fi
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Incomplete stable signing configuration. Set all four secrets."
            exit 1
          fi
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/gaming-ai-release.jks"
          chmod 600 "$RUNNER_TEMP/gaming-ai-release.jks"
          echo "GAMING_AI_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/gaming-ai-release.jks" >> "$GITHUB_ENV"

      - name: Build and verify stable signed APK when available
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GAMING_AI_RELEASE_STORE_PASSWORD: ${{ secrets.GAMING_AI_RELEASE_STORE_PASSWORD }}
          GAMING_AI_RELEASE_KEY_ALIAS: ${{ secrets.GAMING_AI_RELEASE_KEY_ALIAS }}
          GAMING_AI_RELEASE_KEY_PASSWORD: ${{ secrets.GAMING_AI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GAMING_AI_RELEASE_KEYSTORE_PATH:-}" ]; then
            echo "Stable signed release skipped until private signing key is configured."
            exit 0
          fi
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk > signing-certificate.txt
          grep 'Verified using v2 scheme' signing-certificate.txt || true
          sha256sum app/build/outputs/apk/release/app-release.apk
          echo "Stable signing APK verified. Keep keystore and passwords backed up OFF the microSD."

      - name: Upload stable-signed upgradeable APK (when configured)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gaming-ai-rotate-v0.2.0-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload public signing certificate fingerprint (when configured)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gaming-ai-rotate-v0.2.0-signing-certificate
          path: signing-certificate.txt
          if-no-files-found: ignore

